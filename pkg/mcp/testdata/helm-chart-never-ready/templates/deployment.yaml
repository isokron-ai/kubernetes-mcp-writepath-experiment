apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-stuck
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-stuck
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-stuck
    spec:
      containers:
      - name: app
        image: example.invalid/never:0
