# Single-node kind cluster for the kubernetes-mcp-server audit, with API server auditing on.
# WRITTEN, NOT RUN. Create it only through cluster/up.sh (explicit flag, guard checks), which runs
# `kind create cluster --config cluster/kind-config.yaml` FROM THE HARNESS ROOT: kind resolves the relative
# extraMounts host paths below against its working directory (kind v0.33.0,
# pkg/cluster/internal/providers/docker/provision.go, filepath.Abs).
#
# Pins (sources in cluster/PIN): kind v0.33.0; node image kindest/node:v1.37.0 by digest, from the kind v0.33.0
# release notes, cross-checked against Docker Hub. Kubernetes 1.37 matches the target's client-go v0.37.1.
# lib/target.mjs check-kind-config compares name, image, address, port and mounts with config.env.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kms-audit
networking:
  # Loopback only, fixed port, so the guard can check every kubeconfig against 127.0.0.1:16443.
  apiServerAddress: 127.0.0.1
  apiServerPort: 16443
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    extraMounts:
      # The audit policy, read-only. Its sha256 is in every freeze manifest (it is a harness file).
      - hostPath: cluster/audit-policy.yaml
        containerPath: /etc/kubernetes/policies/audit-policy.yaml
        readOnly: true
      # The audit log directory, on the HOST (state/kube-audit/, git-ignored): the log outlives the cluster,
      # the probe adapter reads it by path (no docker exec), and the series seal hashes every file in it.
      - hostPath: state/kube-audit
        containerPath: /var/log/kubernetes
        readOnly: false
    kubeadmConfigPatches:
      # Kubernetes >= 1.36 gets kubeadm v1beta4 from kind v0.33.0, where extraArgs is a list of name/value
      # pairs; with the apiVersion stated, kind merges these by name into its generated config
      # (pkg/internal/patch/kubeadm_merge.go) instead of replacing the list.
      - |
        apiVersion: kubeadm.k8s.io/v1beta4
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            - name: audit-policy-file
              value: /etc/kubernetes/policies/audit-policy.yaml
            - name: audit-log-path
              value: /var/log/kubernetes/kube-apiserver-audit.log
            - name: audit-log-format
              value: json
            # blocking: the request is not answered until its event is written, so nothing the server or the
            # controls do can outrun the record (this is the log backend's default; stated so it is frozen).
            - name: audit-log-mode
              value: blocking
            # Rotation splits the record; a large size and many backups keep one series in one or few files.
            # The per-run collection reads only the live file, so cluster/fingerprint.sh records the file list
            # and a rotation inside a run window makes that run's audit-log check inconclusive.
            - name: audit-log-maxsize
              value: "1024"
            - name: audit-log-maxbackup
              value: "50"
            - name: audit-log-maxage
              value: "60"
          extraVolumes:
            - name: audit-policies
              hostPath: /etc/kubernetes/policies
              mountPath: /etc/kubernetes/policies
              readOnly: true
              pathType: DirectoryOrCreate
            - name: audit-logs
              hostPath: /var/log/kubernetes
              mountPath: /var/log/kubernetes
              readOnly: false
              pathType: DirectoryOrCreate
